
name: MIHVER Haber Toplama

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mihver-haber-toplama
  cancel-in-progress: false

jobs:
  haber-topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dosyasını kontrol et
        run: |
          if [ ! -f haber_toplama.py ]; then
            echo "::error::haber_toplama.py bulunamadı"
            exit 1
          fi

          python -m py_compile haber_toplama.py

      - name: Haberleri topla
        timeout-minutes: 20
        run: |
          python -u haber_toplama.py

      - name: JSON dosyalarını kontrol et
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in [
              "haberler.json",
              "tarama_durumu.json"
          ]:
              path = Path(name)

              if path.exists():
                  with path.open(encoding="utf-8") as f:
                      json.load(f)
                  print(name, "geçerli")
              else:
                  print(name, "henüz oluşturulmamış")
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- haberler.json tarama_durumu.json

          if git diff --cached --quiet; then
            echo "Yeni değişiklik yok."
            exit 0
          fi

          git commit -m "MIHVER haber arşivi güncellendi"

          git pull --rebase origin main
          git push origin HEAD:main
