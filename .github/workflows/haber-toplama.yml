
name: MIHVER Haber Toplama

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mihver-haber-toplama
  cancel-in-progress: false

jobs:
  haber-topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dosyasını kontrol et
        run: |
          if [ ! -f haber_toplama.py ]; then
            echo "HATA: haber_toplama.py dosyası bulunamadı."
            ls -la
            exit 1
          fi
          python -m py_compile haber_toplama.py

      - name: Haberleri topla
        run: python -u haber_toplama.py
        timeout-minutes: 20

      - name: JSON dosyalarını kontrol et
        run: |
          python - <<'PY'
          import json
          for dosya in ["haberler.json", "tarama_durumu.json"]:
              with open(dosya, "r", encoding="utf-8") as f:
                  json.load(f)
              print(dosya, "geçerli")
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haberler.json tarama_durumu.json
          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni değişiklik yok."
          else
            git commit -m "Haber verilerini güncelle"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
