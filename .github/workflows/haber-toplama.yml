
name: MIHVER Haber Toplama

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: mihver-haber-toplama
  cancel-in-progress: false

jobs:
  haber-topla:
    name: haber-topla
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dosyaları kontrol et
        run: |
          echo "Python dosyaları:"
          ls -la *.py
          echo "Çalıştırılacak dosya: haber_toplama.py"
          test -f haber_toplama.py
          python -m py_compile haber_toplama.py

      - name: Haberleri topla
        run: python -u haber_toplama.py
        timeout-minutes: 20

      - name: JSON dosyalarını doğrula
        run: |
          python - <<'PY'
          import json
          import os

          for name in ("haberler.json", "tarama_durumu.json"):
              if not os.path.exists(name):
                  raise SystemExit(f"Dosya bulunamadı: {name}")
              with open(name, encoding="utf-8") as f:
                  json.load(f)
              print(f"{name}: OK")
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add haberler.json tarama_durumu.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni haber verisi yok."
          else
            git commit -m "MİHVER haber verilerini güncelle"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
