
name: MIHVER Otomatik Haber Toplama

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mihver-veri-kayit
  cancel-in-progress: false

jobs:
  haber-topla:
    name: MIHVER Haberleri Topla
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dosyalarını kontrol et
        run: |
          python -m py_compile haber_toplama.py
          python -m py_compile kaynak_kesif.py

      - name: Haberleri topla ve 24 saatlik arşivi temizle
        run: python haber_toplama.py

      - name: Saatlik haber sitesi kaynak keşfi
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$(date -u +%M)" = "00" ]; then
            echo "Kaynak keşfi başlatılıyor."
            python kaynak_kesif.py
          else
            echo "Saatlik keşif zamanı değil. Bu çalıştırmada atlandı."
          fi

      - name: GitHub verisini kontrol et
        run: |
          git fetch origin main

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Depoda yeni değişiklik var. Güvenli kayıt için işlem durduruldu."
            exit 1
          fi

      - name: Haberleri ve kaynakları kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add haberler.json tarama_durumu.json kaynaklar_ek.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni değişiklik yok."
          else
            git commit -m "MIHVER haber ve kaynak verileri güncellendi"
            git push origin HEAD:main
          fi
