
name: MIHVER Kaynak Yönetimi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mihver-veri-kayit
  cancel-in-progress: false

jobs:
  kaynaklar:
    name: Kaynak Keşfi ve Doğrulama
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python kodlarını kontrol et
        run: |
          python -m py_compile \
            kesif_motoru.py \
            kaynak_dogrulama.py

      - name: Yeni kaynakları keşfet
        run: python kesif_motoru.py

      - name: Kaynakları doğrula
        run: python kaynak_dogrulama.py

      - name: Güncel GitHub verisini kontrol et
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "GitHub verisi değişti. Kayıt güvenliği için işlem durduruldu."
            exit 1
          fi

      - name: Kaynak verilerini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kaynaklar.json dogrulama_durumu.json kaynak_dogrulama_raporu.json

          if git diff --cached --quiet; then
            echo "Kaynaklarda yeni değişiklik yok."
          else
            git commit -m "MIHVER kaynakları güncellendi"
            git push origin HEAD:main
          fi
