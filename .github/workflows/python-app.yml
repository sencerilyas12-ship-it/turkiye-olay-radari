
name: Türkiye Olay Radarı

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaynakları keşfet
        run: python kesif_motoru.py

      - name: Haberleri topla
        run: python haber_toplama.py

      - name: Sonuçları GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaynaklar.json haberler.json
          if ! git diff --cached --quiet; then
            git commit -m "Kaynak ve haber verilerini güncelle"
            git push
          else
            echo "Yeni veri bulunmadı."
          fi
