name: MIHVER Kaynak Yönetimi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mihver-veri-kayit
  cancel-in-progress: false

jobs:
  kaynak-envanteri:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Gerekli kütüphaneleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypdf

      - name: Python dosyalarını kontrol et
        run: |
          python -m py_compile kaynak_havuzu_olustur.py
          python -m py_compile kesif_motoru.py
          python -m py_compile kaynak_dogrulama.py
          python -m py_compile kaynak_envanter_kontrol.py

      - name: Kaynak havuzunu oluştur
        run: python kaynak_havuzu_olustur.py

      - name: Kaynak envanterini kontrol et
        run: python kaynak_envanter_kontrol.py

      - name: Yeni kaynakları keşfet
        run: python kesif_motoru.py

      - name: Kaynakları doğrula
        run: python kaynak_dogrulama.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kaynaklar.json
          git add kaynak_havuzu_raporu.json
          git add kaynak_havuzu_ilerleme.json
          git add kaynak_dogrulama_raporu.json
          git add kaynak_envanter_raporu.json

          git diff --cached --quiet || git commit -m "MİHVER kaynak envanteri güncellendi"
          git push
