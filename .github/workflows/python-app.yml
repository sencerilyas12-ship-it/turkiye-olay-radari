
name: MİHVER

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mihver-haber-toplama
  cancel-in-progress: false

jobs:
  build:
    name: MİHVER Haber ve Kaynak Güncelleme
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: MİHVER kodlarını indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaynakları keşfet
        run: python kesif_motoru.py

      - name: Haberleri topla
        run: python haber_toplama.py

      - name: MİHVER verilerini GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kaynaklar.json haberler.json

          if ! git diff --cached --quiet; then
            git commit -m "MİHVER kaynak ve haber verilerini güncelledi"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Yeni veri bulunamadı."
          fi
